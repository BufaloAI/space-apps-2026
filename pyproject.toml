[project]
name = "space-apps-2026"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
nasa = [
    "earthaccess>=0.19.0",
    "h5netcdf>=1.8.3",
    "h5py>=3.16.0",
    "xarray>=2026.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "ml"]
