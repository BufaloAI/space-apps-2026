# Rotasyonlar: her eleman bir sezon; "ana+örtü" yazımıyla örtü bitkisi eklenir.
[rotations.corn_corn]
name = "Sürekli mısır (monokültür)"
name_en = "Continuous corn (monoculture)"
seq = ["corn"]

[rotations.corn_soy]
name = "Mısır → Soya"
name_en = "Corn → Soybean"
seq = ["corn", "soybean"]

[rotations.corn_soy_rye]
name = "Mısır → Soya + çavdar örtü bitkisi"
name_en = "Corn → Soybean + cereal rye cover"
seq = ["corn+cereal_rye", "soybean+cereal_rye"]

[rotations.corn_soy_wheat_vetch]
name = "Mısır → Soya → Buğday + fiğ"
name_en = "Corn → Soybean → Wheat + vetch"
seq = ["corn", "soybean", "winter_wheat+hairy_vetch"]

[rotations.sorghum_soy_wheat]
name = "Sorgum → Soya → Buğday"
name_en = "Sorghum → Soybean → Wheat"
seq = ["sorghum", "soybean", "winter_wheat"]

[rotations.wheat_sorghum_fallow]
name = "Buğday → Sorgum → Nadas"
name_en = "Wheat → Sorghum → Fallow"
seq = ["winter_wheat", "sorghum", "fallow"]

[rotations.wheat_fallow]
name = "Buğday → Nadas"
name_en = "Wheat → Fallow"
seq = ["winter_wheat", "fallow"]

[rotations.wheat_chickpea]
name = "Buğday → Nohut"
name_en = "Wheat → Chickpea"
seq = ["winter_wheat", "chickpea"]

[rotations.sunflower_wheat]
name = "Ayçiçeği → Buğday"
name_en = "Sunflower → Wheat"
seq = ["sunflower", "winter_wheat"]

[rotations.alfalfa_corn]
name = "Yonca (3 yıl) → Mısır (2 yıl)"
name_en = "Alfalfa (3 yr) → Corn (2 yr)"
seq = ["alfalfa", "alfalfa", "alfalfa", "corn", "corn"]

[rotations.cotton_corn]
name = "Pamuk → Mısır"
name_en = "Cotton → Corn"
seq = ["cotton", "corn"]

[rotations.cotton_rye]
name = "Pamuk + çavdar örtü bitkisi"
name_en = "Cotton + cereal rye cover"
seq = ["cotton+cereal_rye"]

[rotations.cotton_soy_wheat]
name = "Pamuk → Soya → Buğday"
name_en = "Cotton → Soybean → Wheat"
seq = ["cotton", "soybean", "winter_wheat"]
