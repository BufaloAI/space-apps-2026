# Ürün ve rotasyon profilleri.
# UYARI: Değerler genel agronomik sezgilerdir (0-1 göreli ölçek, ABD Ortabatı ağırlıklı), ölçüm DEĞİLDİR.
# Yerel uzman/çiftçi tarafından gözden geçirilmeli; yerel veriyle (local_obs) değiştirilebilir.
# water_need: su ihtiyacı | drought_tol / heat_tol / frost_tol: kuraklık / sıcak / don dayanımı
# gdd_need: mevsimlik büyüme derece günü ihtiyacı (taban 10 °C, yaklaşık) | n_fix: azot bağlar
# residue_cover: toprak örtüsü/erozyon koruması | om: organik maddeye katkı | market: genel pazar değeri
# forage: yem değeri | n_need: azot (gübre) ihtiyacı | wet_tol: nemli/yağışlı yaz dayanımı (hastalık) | season: warm (yazlık) / cool (kışlık) / perennial (çok yıllık) / none

